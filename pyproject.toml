[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "allmaptousd"
dynamic = ["version"]
description = "Convert and edit multi-format AGV/AMR maps, check vehicle clearance, and deploy OpenUSD layouts and 3D equipment to Isaac Sim."
license = {text = "MIT"}
requires-python = ">=3.11"
dependencies = [
    "usd-core>=24.8",
    "numpy>=1.26",
    "opencv-python-headless>=4.9",
    "pillow>=10.0",
    "pyyaml>=6.0",
    "ezdxf>=1.3",
    "pydantic>=2.7",
    "fastapi>=0.111",
    "uvicorn>=0.30",
    "python-multipart>=0.0.9",
]

[project.scripts]
allmaptousd = "allmaptousd.cli:main"

[project.optional-dependencies]
desktop = ["pywebview>=5.1"]
step = ["cadquery-ocp>=7.7,<8"]  # The STEP importer uses the OpenCASCADE 7 label sequence API.
dev = ["pytest>=8.0", "ruff>=0.6", "httpx>=0.27"]

[tool.setuptools.dynamic]
version = {attr = "allmaptousd.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
allmaptousd = ["web/static/*.html", "web/static/*.css", "web/static/js/*.js", "samples/*.yaml", "samples/*.pgm"]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["sample_maps/*.smap"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
# B008: FastAPI File()/Form() defaults; B905: zip() over arrays of equal length by construction
ignore = ["B008", "B905"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "sample_maps"]
addopts = "-p no:cacheprovider"
